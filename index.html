<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>40,000 ANE</title>

    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/app.js" defer></script>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon-16x16.png"
    />
    <link rel="manifest" href="./site.webmanifest" />
  </head>

  <body>
    <h1 style="margin: 3px 0 15px 0">40,000 ANE</h1>

    <main style="display: flex; flex-direction: column; gap: 3px">
      <div style="display: flex; width: 100%; gap: 3px">
        <div style="width: 20%">
          <button id="newGame">Juego Nuevo</button>
        </div>

        <div
          style="
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 3px;
          "
        >
          <div>
            <canvas id="grid" width="800" height="800"></canvas>
          </div>
        </div>

        <div
          style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1"
        >
          <div>
            <button id="nextStep" disabled>Turno 0, Siguiente</button>
          </div>

          <div id="stats" style="flex-grow: 1">
            <h2 style="margin: 1px 0">Estad&iacute;sticas</h2>

            <hr style="margin: 1px 0" />

            <ul style="text-align: start; font-family: 'Courier New', Courier, monospace;">
              <li>Homo sapiens</li>
              <ul>
                <li>Macho: <span id="homoSapiens.male">0</span></li>
                <li>Hembra: <span id="homoSapiens.female">0</span></li>
              </ul>
              <li>Panthera spelaea</li>
              <ul>
                <li>Macho: <span id="pantheraSpelaea.male">0</span></li>
                <li>Hembra: <span id="pantheraSpelaea.female">0</span></li>
              </ul>
            </ul>
          </div>
        </div>
      </div>
    </main>

    <div class="floating-bottom notice">
      <span class="close-notice">&times;</span>
      ¡No olvides abrir la consola del navegador!
    </div>
  </body>
</html>
